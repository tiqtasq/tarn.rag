name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # This builds the image. 
      # Because your Dockerfile has 'ENV PYTHONPATH="/app"', 
      # the container is already "pre-configured" to find main.py.
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: my-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run the tests inside the container we just built
      - name: Run tests in Docker
        run: |
          docker run --rm my-app:latest pytest tests/unit
