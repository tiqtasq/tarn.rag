name: Run tests and upload coverage

on:
  push

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    env:
      TIKTASKS_USER_SECRET_KEY: ${{ secrets.TIKTASKS_USER_SECRET_KEY }}
      # Point the gated integration tests at the Postgres service below, so the Postgres dialect
      # (test_postgres.py) and the pgQueuer adapter (test_pgqueuer.py) run in CI and contribute coverage
      # — otherwise they skip and postgres.py / the PgQueuer path show as uncovered.
      TARNRAG_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres

    # pgvector Postgres for the Postgres-dialect + pgQueuer integration tests (pgvector for dense KNN;
    # pgQueuer installs its own tables in the same database).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set PYTHONPATH to repo root
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      - name: Run tests
        # Measure coverage of the package under test, not the test files themselves — otherwise
        # env-gated tests (the cross-encoder integration tests, skipped when the model isn't present in
        # CI) report their own bodies as "uncovered". The Postgres / pgQueuer tests now run (service above).
        run: pytest --cov=tarnrag --cov-branch --cov-report=xml

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
