[project]
name = "tarn-rag"
version = "0.1.0"
description = "RAG ingestion pipeline — composable, DAG-based, database-agnostic"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "aiosqlite",
    "numpy",
    "sqlite-vec",  # §8 retrieval index (dense KNN); also used by the build/tests
]

[project.optional-dependencies]
# Postgres/pgQueuer backends — not needed for the SQLite test path.
postgres = ["asyncpg", "pgvector"]
queue = ["pgqueuer"]
api = ["fastapi", "uvicorn", "python-multipart"]  # multipart = file uploads
onnx = ["onnxruntime", "tokenizers", "huggingface_hub"]  # ONNX embedding pipeline (R4)
embeddings-api = ["httpx"]  # HTTP embedding-API backends (OpenAI / Voyage / Gemini)
generation = ["anthropic"]  # the generation LanguageModel backend (Claude, official SDK)
console = ["rich"]  # rich terminal UI for the interactive console (python -m tarnrag.console)
parsers = ["pypdf", "pdfplumber", "beautifulsoup4"]  # document loaders (permissive)
docling = ["docling"]  # high-fidelity layout-aware PDF extraction (heavy; pulls docling-core + models)
dev = ["pytest", "pytest-asyncio", "httpx", "rich"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tarnrag*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "requires_model: needs the ONNX model fetched (python scripts/fetch_model.py) + onnxruntime/tokenizers; auto-skipped otherwise",
    "slow: long-running; excluded by default in CI via `-m 'not slow'`, run on a nightly/manual job",
    "requires_postgres: needs a reachable PostgreSQL (distributed-mode examples/tests)",
]
